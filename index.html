<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Meridian Group — Corporate Simulator</title>
<style>
:root{
  --bg:#f4f3ee; --panel:#fff; --panel2:#fbfaf6; --border:#d6d4cb; --border2:#e4e2d9;
  --text:#1a1d22; --dim:#5e6570; --muted:#8b919a;
  --navy:#1e3a5f; --navy-light:#e9eef4; --navy-mid:#4a6d96;
  --green:#2a6b3f; --green-light:#e8f2eb;
  --red:#9c2f3c; --red-light:#f7e9eb;
  --amber:#8f6b00; --amber-light:#faf4dc;
  --mono:'SF Mono','Menlo','Consolas','Courier New',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,'Segoe UI','Inter',Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--text);font-size:13px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
#app{height:100vh;display:flex;flex-direction:column}

/* ── Top bar ─────────────────────────────────── */
.topbar{
  display:flex;align-items:center;gap:24px;
  padding:0 22px;height:56px;flex:0 0 56px;
  background:var(--panel);border-bottom:1px solid var(--border);
}
.brand{display:flex;flex-direction:column;line-height:1.15}
.brand-name{font-weight:700;letter-spacing:1.5px;font-size:13px;color:var(--navy)}
.brand-sub{font-size:9.5px;letter-spacing:1.8px;color:var(--muted);text-transform:uppercase}
.top-center{flex:1;display:flex;gap:32px;align-items:center}
.top-stat{display:flex;flex-direction:column;line-height:1.2}
.top-stat .label{font-size:9.5px;letter-spacing:1.2px;color:var(--muted);text-transform:uppercase}
.top-stat .val{font-size:15px;font-weight:600;font-family:var(--mono);color:var(--text)}
.top-stat .val.neg{color:var(--red)}
.top-stat .val.pos{color:var(--green)}
.controls{display:flex;gap:6px}

/* ── Layout ──────────────────────────────────── */
.main{flex:1;display:flex;overflow:hidden;min-height:0}
.sidebar{
  width:196px;flex:0 0 196px;background:var(--panel2);
  border-right:1px solid var(--border);padding:14px 0;overflow-y:auto;
}
.nav-section{
  font-size:9.5px;letter-spacing:1.5px;color:var(--muted);
  padding:14px 20px 6px;text-transform:uppercase;font-weight:600;
}
.nav-btn{
  display:flex;align-items:center;justify-content:space-between;
  width:100%;padding:7px 20px;background:none;border:none;
  font-family:inherit;font-size:12.5px;color:var(--text);
  text-align:left;cursor:pointer;border-left:2px solid transparent;
  transition:background .1s;
}
.nav-btn:hover{background:#f0eee7}
.nav-btn.active{background:var(--navy-light);border-left-color:var(--navy);color:var(--navy);font-weight:600}
.nav-badge{
  background:var(--red);color:#fff;font-size:10px;font-weight:700;
  padding:1px 6px;border-radius:9px;min-width:18px;text-align:center;
}
.nav-badge.zero{display:none}

.content{flex:1;overflow-y:auto;padding:24px 28px;min-width:0}
.content::-webkit-scrollbar{width:10px}
.content::-webkit-scrollbar-thumb{background:#c8c5bb;border-radius:5px;border:2px solid var(--bg)}
.content::-webkit-scrollbar-track{background:transparent}

/* ── Typography ──────────────────────────────── */
h1{font-size:22px;font-weight:700;letter-spacing:-.3px;margin-bottom:4px}
h2{font-size:15px;font-weight:700;letter-spacing:.2px;margin:22px 0 12px;color:var(--navy)}
h3{font-size:13px;font-weight:700;letter-spacing:.2px;margin:16px 0 8px;color:var(--text)}
.subtitle{color:var(--dim);font-size:12.5px;margin-bottom:20px}
.mono{font-family:var(--mono)}
.dim{color:var(--dim)} .muted{color:var(--muted)}
.green{color:var(--green)} .red{color:var(--red)}
.text-right{text-align:right}

/* ── Buttons ─────────────────────────────────── */
button{
  font-family:inherit;font-size:12px;cursor:pointer;
  background:var(--panel);color:var(--text);
  border:1px solid var(--border);border-radius:4px;
  padding:6px 12px;transition:all .1s;
}
button:hover:not(:disabled){background:#f0eee7;border-color:#bbb8ae}
button:disabled{opacity:.35;cursor:not-allowed}
button.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
button.primary:hover:not(:disabled){background:#152c4a;border-color:#152c4a}
button.danger{color:var(--red);border-color:#d4b8bc}
button.danger:hover:not(:disabled){background:var(--red-light)}
button.sm{font-size:11px;padding:4px 9px}

/* ── Cards / panels ──────────────────────────── */
.card{
  background:var(--panel);border:1px solid var(--border);
  border-radius:6px;padding:16px 18px;margin-bottom:14px;
}
.card-title{
  font-size:11px;letter-spacing:1.2px;color:var(--muted);
  text-transform:uppercase;font-weight:600;margin-bottom:10px;
}
.kv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.kv{display:flex;flex-direction:column;line-height:1.3}
.kv .lbl{font-size:10px;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
.kv .val{font-size:18px;font-weight:600;font-family:var(--mono);margin-top:2px}
.kv .val.neg{color:var(--red)}
.kv .val.pos{color:var(--green)}

/* ── Entity cards ────────────────────────────── */
.entity-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.entity-card{
  background:var(--panel);border:1px solid var(--border);border-radius:6px;
  padding:14px 16px;cursor:pointer;transition:all .12s;
}
.entity-card:hover{border-color:var(--navy-mid);box-shadow:0 1px 4px rgba(0,0,0,.04)}
.entity-card .name{font-weight:700;font-size:13.5px;margin-bottom:2px}
.entity-card .type{font-size:10px;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
.entity-card .metrics{
  display:flex;gap:20px;margin-top:12px;padding-top:10px;
  border-top:1px solid var(--border2);
}
.entity-card .metric{display:flex;flex-direction:column;line-height:1.2}
.entity-card .metric .lbl{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.entity-card .metric .val{font-family:var(--mono);font-size:13px;font-weight:600;margin-top:1px}

/* ── Tables ──────────────────────────────────── */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{
  text-align:left;font-weight:600;font-size:10.5px;letter-spacing:1px;
  color:var(--muted);text-transform:uppercase;
  padding:8px 10px;border-bottom:1px solid var(--border);background:var(--panel2);
}
th.num,td.num{text-align:right;font-family:var(--mono)}
td{padding:6px 10px;border-bottom:1px solid var(--border2)}
tr:last-child td{border-bottom:none}
tr.total td{font-weight:700;border-top:1.5px solid var(--border);border-bottom:none;padding-top:9px}
tr.subtotal td{font-weight:600;border-top:1px solid var(--border2);padding-top:8px}
tr:hover td{background:#faf9f5}

/* ── Statements ──────────────────────────────── */
.stmt{
  background:var(--panel);border:1px solid var(--border);
  border-radius:6px;padding:20px 22px;margin-bottom:14px;max-width:780px;
}
.stmt-head{margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.stmt-title{font-size:14px;font-weight:700;letter-spacing:.3px}
.stmt-sub{font-size:11px;color:var(--dim);margin-top:3px}
.stmt-section{margin-top:16px;margin-bottom:6px;font-size:11px;letter-spacing:1.2px;
  text-transform:uppercase;font-weight:700;color:var(--navy)}

/* ── Documents ───────────────────────────────── */
.doc{
  background:var(--panel);border:1px solid var(--border);
  border-left:3px solid var(--border);border-radius:4px;
  padding:14px 16px;margin-bottom:10px;
}
.doc.unread{border-left-color:var(--navy);background:#fdfcf8}
.doc.decision{border-left-color:var(--amber)}
.doc.warn{border-left-color:var(--red)}
.doc-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;gap:12px}
.doc-title{font-weight:600;font-size:13px}
.doc-date{font-size:11px;color:var(--muted);font-family:var(--mono);white-space:nowrap}
.doc-body{color:var(--dim);font-size:12.5px;line-height:1.55}
.doc-actions{display:flex;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border2)}
.doc-type{font-size:9.5px;letter-spacing:1.2px;color:var(--muted);text-transform:uppercase;font-weight:600}

/* ── Tabs ────────────────────────────────────── */
.tabs{display:flex;gap:2px;margin-bottom:16px;border-bottom:1px solid var(--border)}
.tab{
  padding:8px 14px;background:none;border:none;border-bottom:2px solid transparent;
  font-family:inherit;font-size:12.5px;color:var(--dim);cursor:pointer;font-weight:500;
}
.tab.active{color:var(--navy);border-bottom-color:var(--navy);font-weight:600}
.tab:hover:not(.active){color:var(--text)}

/* ── Activity feed ──────────────────────────── */
.feed{background:var(--panel);border:1px solid var(--border);border-radius:6px;
  max-height:240px;overflow-y:auto}
.feed-item{padding:8px 14px;border-bottom:1px solid var(--border2);font-size:12px;
  display:flex;gap:12px;align-items:flex-start}
.feed-item:last-child{border-bottom:none}
.feed-date{color:var(--muted);font-family:var(--mono);font-size:10.5px;flex:0 0 78px;padding-top:1px}
.feed-text{flex:1;color:var(--text)}
.feed-text.good{color:var(--green)} .feed-text.bad{color:var(--red)} .feed-text.warn{color:var(--amber)}

/* ── Forms ──────────────────────────────────── */
.form-row{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.form-row label{flex:0 0 130px;font-size:12px;color:var(--dim)}
.form-row select,.form-row input{
  font-family:inherit;font-size:12px;padding:5px 8px;
  border:1px solid var(--border);border-radius:4px;background:var(--panel);
  color:var(--text);
}
.form-row select:focus,.form-row input:focus{outline:none;border-color:var(--navy-mid)}

/* ── Empty state ────────────────────────────── */
.empty{
  padding:40px 20px;text-align:center;color:var(--muted);
  font-size:12.5px;background:var(--panel);
  border:1px dashed var(--border);border-radius:6px;
}

/* ── Overlay / End screen ───────────────────── */
.overlay{
  position:fixed;inset:0;background:rgba(20,25,35,.72);
  display:none;align-items:center;justify-content:center;z-index:100;
}
.overlay.show{display:flex}
.overlay-card{
  background:var(--panel);border-radius:8px;padding:32px 40px;
  max-width:560px;width:90%;box-shadow:0 10px 40px rgba(0,0,0,.3);
}
.overlay-card h1{margin-bottom:6px}
.overlay-card .sub{color:var(--dim);margin-bottom:22px}
.overlay-stats{display:grid;grid-template-columns:1fr auto;gap:6px 24px;margin-bottom:22px}
.overlay-stats .lbl{color:var(--dim)}
.overlay-stats .val{font-family:var(--mono);font-weight:600;text-align:right}
.overlay-card button{margin-top:8px}

/* ── Misc ───────────────────────────────────── */
.divider{height:1px;background:var(--border);margin:16px 0}
.flex-between{display:flex;justify-content:space-between;align-items:center;gap:12px}
.tag{display:inline-block;font-size:10px;letter-spacing:.8px;text-transform:uppercase;
  padding:2px 7px;border-radius:3px;font-weight:600}
.tag.opco{background:var(--navy-light);color:var(--navy)}
.tag.holding{background:#f0ede4;color:#7a6a3f}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10.5px;
  background:var(--panel2);border:1px solid var(--border);font-family:var(--mono)}
.pill.green{background:var(--green-light);border-color:#c5dccb;color:var(--green)}
.pill.red{background:var(--red-light);border-color:#e0c4c9;color:var(--red)}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-name">MERIDIAN GROUP</div>
      <div class="brand-sub">Corporate Operations</div>
    </div>
    <div class="top-center">
      <div class="top-stat"><span class="label">Date</span><span class="val" id="topDate">—</span></div>
      <div class="top-stat"><span class="label">Group Cash</span><span class="val" id="topCash">—</span></div>
      <div class="top-stat"><span class="label">YTD Net Income</span><span class="val" id="topPL">—</span></div>
      <div class="top-stat"><span class="label">Entities</span><span class="val" id="topEntities">—</span></div>
    </div>
    <div class="controls">
      <button id="bDay">+1d</button>
      <button id="bWeek">+1w</button>
      <button id="bMonth">+1m</button>
      <button id="bAuto" class="primary">▶ Auto</button>
    </div>
  </header>
  <div class="main">
    <nav class="sidebar" id="sidebar">
      <div class="nav-section">Group</div>
      <button class="nav-btn active" data-screen="overview">Overview</button>
      <button class="nav-btn" data-screen="entities">Companies</button>
      <div class="nav-section">Analysis</div>
      <button class="nav-btn" data-screen="finance">Financials</button>
      <button class="nav-btn" data-screen="people">People</button>
      <div class="nav-section">Operations</div>
      <button class="nav-btn" data-screen="inbox">Inbox <span class="nav-badge zero" id="navInbox">0</span></button>
      <button class="nav-btn" data-screen="market">Capital Markets</button>
      <button class="nav-btn" data-screen="actions">Actions</button>
    </nav>
    <main class="content" id="content"></main>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="overlay-card" id="overlayCard"></div>
</div>

<script>
(function(){
'use strict';

// ═══════════════════════════════════════════════════════════════
//  UTILITIES
// ═══════════════════════════════════════════════════════════════
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function pad(n){ return String(n).padStart(2,'0'); }
function addDays(d,n){
  const dt = new Date(d.y, d.m-1, d.d);
  dt.setDate(dt.getDate()+n);
  return {y:dt.getFullYear(), m:dt.getMonth()+1, d:dt.getDate()};
}
function isBiz(d){
  const dow = new Date(d.y, d.m-1, d.d).getDay();
  return dow !== 0 && dow !== 6;
}
function nextBiz(d){
  let x = addDays(d,1);
  while(!isBiz(x)) x = addDays(x,1);
  return x;
}
function fmtDate(d){
  const dt = new Date(d.y, d.m-1, d.d);
  return `${DOW[dt.getDay()]}, ${MON[d.m-1]} ${d.d}, ${d.y}`;
}
function fmtDateShort(d){ return `${MON[d.m-1]} ${d.d}`; }
function fmtDateMed(d){ return `${MON[d.m-1]} ${d.d}, ${d.y}`; }
function dateNum(d){ return d.y*10000 + d.m*100 + d.d; }
function dateLE(a,b){ return dateNum(a) <= dateNum(b); }
function dateLT(a,b){ return dateNum(a) < dateNum(b); }
function dateGE(a,b){ return dateNum(a) >= dateNum(b); }
function sameMonth(a,b){ return a.y===b.y && a.m===b.m; }
function sameYear(a,b){ return a.y===b.y; }

function fm(n){
  if(n === null || n === undefined) return '—';
  const neg = n < 0;
  const abs = Math.abs(Math.round(n));
  const s = abs.toLocaleString('en-US');
  return (neg?'−$':'$') + s;
}
function fn(n){
  if(n === null || n === undefined) return '—';
  const neg = n < 0;
  const abs = Math.abs(Math.round(n));
  return (neg?'−':'') + abs.toLocaleString('en-US');
}
function pct(n){ return (n*100).toFixed(1) + '%'; }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function firstBizOfMonth(d){
  if(!isBiz(d)) return false;
  let p = addDays(d,-1);
  while(!isBiz(p)) p = addDays(p,-1);
  return p.m !== d.m;
}
function lastBizOfMonth(d){
  if(!isBiz(d)) return false;
  let n = addDays(d,1);
  while(!isBiz(n)) n = addDays(n,1);
  return n.m !== d.m;
}

// ═══════════════════════════════════════════════════════════════
//  CHART OF ACCOUNTS
// ═══════════════════════════════════════════════════════════════
const ACC = {
  '1000':{name:'Cash',                 type:'asset'},
  '1100':{name:'Accounts Receivable',  type:'asset'},
  '1200':{name:'Inventory',            type:'asset'},
  '1400':{name:'Investment in Subs',   type:'asset'},
  '1500':{name:'Equipment',            type:'asset'},
  '1510':{name:'Accum. Depreciation',  type:'contra-asset'},
  '2000':{name:'Accounts Payable',     type:'liability'},
  '2200':{name:'Bank Loans',           type:'liability'},
  '3000':{name:'Common Stock',         type:'equity'},
  '3200':{name:'Dividends',            type:'contra-equity'},
  '4000':{name:'Revenue',              type:'revenue'},
  '4100':{name:'Dividend Income',      type:'revenue'},
  '5000':{name:'Cost of Goods Sold',   type:'expense'},
  '6000':{name:'Salaries',             type:'expense'},
  '6600':{name:'Payroll Taxes',        type:'expense'},
  '6100':{name:'Rent',                 type:'expense'},
  '6200':{name:'Utilities',            type:'expense'},
  '6300':{name:'Marketing',            type:'expense'},
  '6400':{name:'Professional Fees',    type:'expense'},
  '6500':{name:'Depreciation',         type:'expense'},
  '7000':{name:'Interest Expense',     type:'expense'},
  '8000':{name:'Income Tax',           type:'expense'},
};

// ═══════════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════════
const S = {
  date:{y:2024,m:1,d:2},
  entities:[],
  nextId:1,
  screen:'overview',
  selectedEntity:null,
  selectedDoc:null,
  docs:[],
  feed:[],
  paused:false,
  autoTimer:null,
  gameOver:false,
  gameOverReason:null,
  campaignEnd:{y:2026,m:12,d:31},
  finTab:'pl',
  peopleEntity:null,
  lastMonthSeen:null,
};

// ═══════════════════════════════════════════════════════════════
//  ACCOUNTING
// ═══════════════════════════════════════════════════════════════
function post(entity, memo, lines){
  const je = {id:'JE'+S.nextId++, date:{...S.date}, memo, lines};
  let dr = 0, cr = 0;
  for(const l of lines){ dr += (l.debit||0); cr += (l.credit||0); }
  if(Math.abs(dr-cr) > 0.01){
    console.warn('Unbalanced JE', je, dr, cr);
    return null;
  }
  entity.ledger.push(je);
  return je;
}
function bal(entity, code, from, to){
  let b = 0;
  for(const je of entity.ledger){
    if(from && !dateGE(je.date, from)) continue;
    if(to && !dateLE(je.date, to)) continue;
    for(const l of je.lines){
      if(l.account === code) b += (l.debit||0) - (l.credit||0);
    }
  }
  return b;
}
function entityCash(e){ return bal(e, '1000'); }

function getPL(entity, from, to){
  const lines = {};
  let rev = 0, cogs = 0, opex = {};
  const EXPCODES = ['5000','6000','6600','6100','6200','6300','6400','6500','7000','8000'];
  const REVCODES = ['4000','4100'];
  for(const je of entity.ledger){
    if(from && !dateGE(je.date, from)) continue;
    if(to && !dateLE(je.date, to)) continue;
    for(const l of je.lines){
      if(REVCODES.includes(l.account)){
        rev += (l.credit||0) - (l.debit||0);
      } else if(EXPCODES.includes(l.account)){
        const amt = (l.debit||0) - (l.credit||0);
        if(l.account === '5000') cogs += amt;
        else opex[l.account] = (opex[l.account]||0) + amt;
      }
    }
  }
  const opexTotal = Object.values(opex).reduce((a,b)=>a+b,0);
  return {revenue:rev, cogs, grossProfit:rev-cogs, opex, opexTotal, netIncome:rev-cogs-opexTotal};
}

function getBS(entity, asOf){
  const assets = {
    '1000':bal(entity,'1000',null,asOf),
    '1100':bal(entity,'1100',null,asOf),
    '1200':bal(entity,'1200',null,asOf),
    '1400':bal(entity,'1400',null,asOf),
    '1500':bal(entity,'1500',null,asOf),
    '1510':bal(entity,'1510',null,asOf),
  };
  const liabs = {
    '2000':-bal(entity,'2000',null,asOf),
    '2200':-bal(entity,'2200',null,asOf),
  };
  const commonStock = -bal(entity,'3000',null,asOf);
  const dividends = bal(entity,'3200',null,asOf);
  const plAll = getPL(entity, null, asOf);
  const retained = plAll.netIncome - dividends;
  const totalAssets = assets['1000']+assets['1100']+assets['1200']+assets['1400']+assets['1500']+assets['1510'];
  const totalLiabs = Object.values(liabs).reduce((a,b)=>a+b,0);
  const totalEquity = commonStock + retained;
  return {assets, liabs, commonStock, retained, totalAssets, totalLiabs, totalEquity};
}

// ═══════════════════════════════════════════════════════════════
//  ENTITY HELPERS
// ═══════════════════════════════════════════════════════════════
function newEntity(opts){
  const e = {
    id:'E'+S.nextId++,
    name:opts.name,
    type:opts.type,
    industry:opts.industry || null,
    parentId:opts.parentId || null,
    ownership:opts.ownership ?? 1.0,
    ledger:[],
    employees:[],
    customers:[],
    suppliers:[],
    ar:[],
    ap:[],
    loans:[],
    marketingBudget:0,
    simplified:opts.simplified || null, // {revenue, costs, dividendPolicy}
    foundedDate:{...S.date},
  };
  S.entities.push(e);
  return e;
}
function getEntity(id){ return S.entities.find(e=>e.id===id); }
function opcos(){ return S.entities.filter(e=>e.type==='opco'); }
function holding(){ return S.entities.find(e=>e.type==='holding'); }
function groupCash(){ return S.entities.reduce((s,e)=>s+entityCash(e),0); }

//  SIMULATION — SALES, COLLECTIONS, PAYMENTS, PAYROLL
// ═══════════════════════════════════════════════════════════════
function processSales(e, initial){
  if(e.simplified) return;
  for(const c of e.customers){
    if(c.status !== 'active') continue;
    // Monthly revenue with slight variance
    const variance = 0.94 + Math.random()*0.12;
    const amount = Math.round(c.monthly * variance);
    const cogs = Math.round(amount * c.cogsPct);

    post(e, `Invoice — ${c.name}`, [
      {account:'1100', debit:amount},
      {account:'4000', credit:amount},
      {account:'5000', debit:cogs},
      {account:'1200', credit:cogs},
    ]);

    e.ar.push({
      id:'AR'+S.nextId++,
      customer:c.name,
      amount,
      invoiced:{...S.date},
      due:addDays(S.date, c.terms),
      status:'open',
    });
  }

  // Replenish inventory if low
  const inv = bal(e, '1200');
  if(inv < e.inventoryTarget){
    const needed = e.inventoryTarget - inv;
    post(e, 'Purchase order — inventory', [
      {account:'1200', debit:needed},
      {account:'2000', credit:needed},
    ]);
    e.ap.push({
      id:'AP'+S.nextId++,
      supplier:'Yirgacheffe Traders',
      amount:needed,
      received:{...S.date},
      due:addDays(S.date, 30),
      status:'open',
    });
  }
}

function processCollections(e){
  if(e.simplified) return;
  for(const ar of e.ar){
    if(ar.status !== 'open') continue;
    if(dateGE(S.date, ar.due)){
      // Late chance
      const lateness = Math.random();
      if(lateness < 0.04){
        ar.due = addDays(ar.due, 30);
        ar.lateCount = (ar.lateCount||0)+1;
        if(ar.lateCount === 1){
          addDoc({
            type:'notice', kind:'warn',
            title:`Late payment: ${ar.customer}`,
            body:`Invoice for ${fm(ar.amount)} from ${ar.customer} was due ${fmtDateMed(ar.due)}. They have requested a 30-day extension. Net-30 terms are stretched to Net-60.`,
          });
        }
        continue;
      }
      post(e, `Collection — ${ar.customer}`, [
        {account:'1000', debit:ar.amount},
        {account:'1100', credit:ar.amount},
      ]);
      ar.status = 'paid';
    }
  }
  // Write off severely overdue
  for(const ar of e.ar){
    if(ar.status !== 'open') continue;
    const days = Math.floor((dateNum(S.date)-dateNum(ar.due))/10000*365 + (S.date.m-ar.due.m)*30 + (S.date.d-ar.due.d));
    if(days > 120){
      post(e, `Bad debt writeoff — ${ar.customer}`, [
        {account:'6400', debit:ar.amount},
        {account:'1100', credit:ar.amount},
      ]);
      ar.status = 'written-off';
      addDoc({
        type:'notice', kind:'warn',
        title:`Bad debt: ${ar.customer}`,
        body:`Invoice for ${fm(ar.amount)} has been outstanding over 120 days. Written off as bad debt.`,
      });
    }
  }
}

function processPayments(e){
  if(e.simplified) return;
  for(const ap of e.ap){
    if(ap.status !== 'open') continue;
    if(dateGE(S.date, ap.due)){
      post(e, `Payment — ${ap.supplier}`, [
        {account:'2000', debit:ap.amount},
        {account:'1000', credit:ap.amount},
      ]);
      ap.status = 'paid';
    }
  }
}

function processPayroll(e){
  if(e.simplified) return;
  if(e.employees.length === 0) return;
  const totalSalary = e.employees.reduce((s,emp)=>s+emp.salary,0);
  const monthly = Math.round(totalSalary/12);
  const taxes = Math.round(monthly * 0.25);

  if(entityCash(e) < monthly + taxes){
    addDoc({
      type:'decision', kind:'warn',
      title:`PAYROLL SHORTFALL — ${e.name}`,
      body:`Insufficient cash to meet payroll of ${fm(monthly+taxes)}. Cash on hand: ${fm(entityCash(e))}. Options: transfer from parent company (if available), or miss payroll.`,
      options:[
        {label:'Transfer from HoldCo', action:'rescue-payroll', entityId:e.id, amount:monthly+taxes},
        {label:'Defer payroll (unpaid wages)', action:'defer-payroll', entityId:e.id},
      ],
    });
  }

  post(e, 'Monthly payroll', [
    {account:'6000', debit:monthly},
    {account:'6600', debit:taxes},
    {account:'1000', credit:monthly+taxes},
  ]);
}

function processRent(e){
  if(e.simplified) return;
  post(e, 'Monthly rent', [
    {account:'6100', debit:4500},
    {account:'1000', credit:4500},
  ]);
}

function processUtilities(e){
  if(e.simplified) return;
  post(e, 'Monthly utilities', [
    {account:'6200', debit:800},
    {account:'1000', credit:800},
  ]);
}

function processDepreciation(e){
  if(e.simplified) return;
  const equip = bal(e, '1500');
  if(equip > 0){
    const dep = Math.round(equip/120);
    post(e, 'Monthly depreciation', [
      {account:'6500', debit:dep},
      {account:'1510', credit:dep},
    ]);
  }
}

function processSimplified(e){
  if(!e.simplified) return;
  const rev = e.simplified.revenue;
  const costs = e.simplified.costs;
  post(e, 'Monthly operations', [
    {account:'1000', debit:rev},
    {account:'4000', credit:rev},
    {account:'5000', debit:costs},
    {account:'1000', credit:costs},
  ]);
  // Dividend distribution to parent
  const net = rev - costs;
  if(net > 0 && e.simplified.dividendPolicy > 0){
    const dividend = Math.round(net * e.simplified.dividendPolicy);
    if(dividend > 0){
      post(e, 'Dividend to parent', [
        {account:'3200', debit:dividend},
        {account:'1000', credit:dividend},
      ]);
      const parent = getEntity(e.parentId);
      if(parent){
        post(parent, `Dividend from ${e.name}`, [
          {account:'1000', debit:dividend},
          {account:'4100', credit:dividend},
        ]);
      }
    }
  }
}

// ═══════════════════════════════════════════════════════════════
function randomEvents(){
  for(const e of opcos()){
    if(e.simplified) continue;

    // Employee resignation
    if(e.employees.length > 0 && Math.random() < 0.006){
      const idx = Math.floor(Math.random() * e.employees.length);
      const emp = e.employees[idx];
      e.employees.splice(idx, 1);
      addDoc({
        type:'notice', kind:'warn',
        title:`Resignation: ${emp.name}`,
        body:`${emp.name} (${emp.role}) has submitted their resignation, effective in 2 weeks. Salary: ${fm(emp.salary)}/year.`,
        options:[{label:'Acknowledge', action:'dismiss-doc'}],
      });
      addFeed(`${emp.name} resigned from ${e.name}.`, 'warn');
    }

    // Customer churn
    if(Math.random() < 0.008){
      const active = e.customers.filter(c=>c.status==='active');
      if(active.length > 1){
        const c = active[Math.floor(Math.random()*active.length)];
        c.status = 'churned';
        addDoc({
          type:'notice', kind:'warn',
          title:`Contract lost: ${c.name}`,
          body:`${c.name} has ended their wholesale agreement. Monthly revenue impact: ${fm(c.monthly)}.`,
        });
        addFeed(`Lost customer: ${c.name} (${fm(c.monthly)}/mo)`, 'bad');
      }
    }
  }
}

function tickDay(){
  if(S.gameOver) return;
  S.date = nextBiz(S.date);

  const firstBiz = firstBizOfMonth(S.date);
  const lastBiz = lastBizOfMonth(S.date);
  const day15 = S.date.d === 15;
  const day5 = S.date.d === 5;

  for(const e of S.entities){
    if(e.type === 'holding') continue;

    if(e.simplified){
      if(firstBiz) processSimplified(e);
      continue;
    }

    if(firstBiz){
      processSales(e);
      processRent(e);
    }
    if(day15) processUtilities(e);
    if(day5 && e.marketingBudget > 0){
      post(e, 'Marketing campaign', [
        {account:'6300', debit:e.marketingBudget},
        {account:'1000', credit:e.marketingBudget},
      ]);
    }
    if(lastBiz){
      processPayroll(e);
      processDepreciation(e);
    }

    processCollections(e);
    processPayments(e);
  }

  randomEvents();

  // Monthly close document
  if(lastBiz){
    monthlySummaryDocs();
  }

  // Check bankruptcy
  if(groupCash() < -100000){
    endGame('INSOLVENCY', 'The group has exhausted its credit. Creditors have filed for administration.');
  }

  // Check campaign end
  if(dateGE(S.date, S.campaignEnd)){
    endGame('CAMPAIGN COMPLETE', 'You have reached the end of the three-year period.');
  }

  render();
}

function monthlySummaryDocs(){
  const hc = holding();
  for(const e of opcos()){
    if(e.simplified) continue;
    const pl = getPL(e, {y:S.date.y, m:S.date.m, d:1}, S.date);
    addFeed(`${e.name}: ${fm(pl.revenue)} revenue, ${fm(pl.netIncome)} net income`, pl.netIncome>=0?'good':'bad');
  }
}

}

  const emp = e.employees[idx];
  e.employees.splice(idx, 1);
  const severance = Math.round(emp.salary/12);
  post(e, `Severance — ${emp.name}`, [
    {account:'6000', debit:severance},
    {account:'1000', credit:severance},
  ]);
  addFeed(`Terminated ${emp.name} (${emp.role}). Severance ${fm(severance)}`, 'warn');

function runSalesPush(entityId){
  const e = getEntity(entityId);
  if(!e) return;
  const cost = 4000;
  if(entityCash(e) < cost){ addFeed('Insufficient cash for sales push', 'warn'); render(); return; }
  post(e, 'Sales development expense', [
    {account:'6300', debit:cost},
    {account:'1000', credit:cost},
  ]);
  const salesReps = e.employees.filter(emp => ['Sales Rep','Sales Manager'].includes(emp.role)).length;
  const chance = 0.20 + salesReps * 0.12;
  if(Math.random() < chance){
    const newCustomer = generateCustomer();
    e.customers.push(newCustomer);
    addFeed(`Won new account: ${newCustomer.name} (${fm(newCustomer.monthly)}/mo)`, 'good');
    addDoc({
      type:'notice', kind:'info',
      title:`New account signed: ${newCustomer.name}`,
      body:`Terms: ${fmtDateMed(S.date)}, monthly revenue ${fm(newCustomer.monthly)}, Net-${newCustomer.terms}.`,
    });
  } else {
    addFeed('Sales push completed — no new account signed', 'warn');
  }
  render();
}

function endGame(reason, message){
  S.gameOver = true;
  S.paused = true;
  if(S.autoTimer){ clearInterval(S.autoTimer); S.autoTimer = null; }
  const hc = holding();
  const bs = getBS(hc, S.date);
  const totalAssets = S.entities.reduce((s,e)=>s+getBS(e,S.date).totalAssets,0);
  const totalLiabs = S.entities.reduce((s,e)=>s+getBS(e,S.date).totalLiabs,0);
  const equity = totalAssets - totalLiabs;
  const cards = `
    <h1>${esc(reason)}</h1>
    <div class="sub">${esc(message)}</div>
    <div class="overlay-stats">
      <div class="lbl">Group cash</div><div class="val">${fm(groupCash())}</div>
      <div class="lbl">Combined assets</div><div class="val">${fm(totalAssets)}</div>
      <div class="lbl">Combined liabilities</div><div class="val">${fm(totalLiabs)}</div>
      <div class="lbl">Shareholder equity</div><div class="val">${fm(equity)}</div>
      <div class="lbl">Entities</div><div class="val">${S.entities.length}</div>

function renderPL(e, month, ytd){
  const rows = [
    {label:'Revenue', code:'4000', rev:true},
    {label:'Dividend Income', code:'4100', rev:true},
    {label:'— Cost of Goods Sold', code:'5000'},
    {label:'— Salaries', code:'6000'},
    {label:'— Payroll Taxes', code:'6600'},
    {label:'— Rent', code:'6100'},
    {label:'— Utilities', code:'6200'},
    {label:'— Marketing', code:'6300'},
    {label:'— Professional Fees', code:'6400'},
    {label:'— Depreciation', code:'6500'},
    {label:'— Interest Expense', code:'7000'},
    {label:'— Income Tax', code:'8000'},
  ];
  function val(pl, code){
    if(code==='4000') return pl.revenue;
    if(code==='5000') return pl.cogs;
    return pl.opex[code] || 0;
  }
  let html = `<div class="stmt">
    <div class="stmt-head">
      <div class="stmt-title">Income Statement — ${esc(e.name)}</div>
      <div class="stmt-sub">Period ending ${fmtDateMed(S.date)}</div>
    </div>
    <table>
      <thead><tr><th></th><th class="num">Current Month</th><th class="num">Year to Date</th></tr></thead>
      <tbody>`;
  for(const r of rows){
    const mv = val(month, r.code);
    const yv = val(ytd, r.code);
    if(mv === 0 && yv === 0) continue;
    const label = r.rev ? r.label : r.label;
    const cls = r.rev ? '' : '';
    html += `<tr><td class="${cls}">${label}</td><td class="num">${fm(mv)}</td><td class="num">${fm(yv)}</td></tr>`;
  }
  const nIM = month.netIncome, nIY = ytd.netIncome;
  html += `<tr class="total"><td>Net Income</td><td class="num ${nIM<0?'red':'green'}">${fm(nIM)}</td><td class="num ${nIY<0?'red':'green'}">${fm(nIY)}</td></tr>`;
  html += `</tbody></table></div>`;
  return html;
}

function renderCF(e){
  const from = {y:S.date.y, m:S.date.m, d:1};
  const fromYTD = {y:S.date.y, m:1, d:1};

  // Simplified cash flow
  let opening = 0, closing = entityCash(e);
  // Opening = balance at start of month = closing minus net change
  for(const je of e.ledger){
    if(dateLT(je.date, from)) {
      for(const l of je.lines) if(l.account==='1000') opening += (l.debit||0)-(l.credit||0);
    }
  }
  const netChange = closing - opening;

  // Categorize entries
  let operating = 0, investing = 0, financing = 0;
  for(const je of e.ledger){
    if(!dateGE(je.date, from) || !dateLE(je.date, S.date)) continue;
    for(const l of je.lines){
      if(l.account !== '1000') continue;
      const amt = (l.debit||0) - (l.credit||0);
      // Determine category by looking at other lines
      const otherAccts = je.lines.filter(x=>x.account!=='1000').map(x=>x.account);
      if(otherAccts.some(a=>['1400','1500','1510'].includes(a))) investing += amt;
      else if(otherAccts.some(a=>['2200','3000','3200'].includes(a))) financing += amt;
      else operating += amt;
    }
  }

  let html = `<div class="stmt">
    <div class="stmt-head">
      <div class="stmt-title">Cash Flow Statement — ${esc(e.name)}</div>
      <div class="stmt-sub">For the month ending ${fmtDateMed(S.date)}</div>
    </div>
    <table><tbody>
      <tr><td>Opening Cash</td><td class="num">${fm(opening)}</td></tr>
      <tr class="subtotal"><td>Net Cash from Operating Activities</td><td class="num ${operating<0?'red':''}">${fm(operating)}</td></tr>
      <tr class="subtotal"><td>Net Cash from Investing Activities</td><td class="num ${investing<0?'red':''}">${fm(investing)}</td></tr>
      <tr class="subtotal"><td>Net Cash from Financing Activities</td><td class="num ${financing<0?'red':''}">${fm(financing)}</td></tr>
      <tr class="total"><td>Net Change in Cash</td><td class="num ${netChange<0?'red':'green'}">${fm(netChange)}</td></tr>
      <tr class="total"><td>Closing Cash</td><td class="num">${fm(closing)}</td></tr>
    </tbody></table></div>`;
  return html;
}

        <div class="kv"><span class="lbl">Monthly Net</span><span class="val green">$6,000</span></div>
      </div>
      <div style="margin-top:10px"><button data-found="cafe" ${cash>=150000?'primary':''} ${cash>=150000?'':'disabled'}>Found Café</button></div>
    </div>
    <div class="card">
      <div class="kv-grid">
        <div class="kv"><span class="lbl">Meridian Consulting</span><span class="val">$50,000</span></div>
        <div class="kv"><span class="lbl">Setup Cost</span><span class="val">$50,000</span></div>
        <div class="kv"><span class="lbl">Monthly Rev</span><span class="val">$18,000</span></div>
        <div class="kv"><span class="lbl">Monthly Net</span><span class="val green">$4,000</span></div>
      </div>
      <div style="margin-top:10px"><button data-found="consulting" ${cash>=50000?'primary':''} ${cash>=50000?'':'disabled'}>Found Consulting</button></div>
    </div>

    <h2>Financing</h2>
    <div class="card">
      <div class="form-row">
        <label>Bank Loan (8%)</label>
        <button data-loan="${hc.id}" data-amount="250000" class="primary" ${cash>=0?'':'disabled'}>Borrow $250,000</button>
        <button data-loan="${hc.id}" data-amount="100000" ${cash>=0?'':'disabled'}>Borrow $100,000</button>
      </div>
      <div class="dim" style="font-size:11.5px;margin-top:8px">Loans post to the balance sheet as liabilities. Interest accrues monthly.</div>
    </div>`;

  return html;
}

// ── Actions ────────────────────────────────────
function renderActions(){
  const op = opcos()[0];
  if(!op) return '<div class="empty">No operating company.</div>';

  let html = `<h1>Actions</h1><div class="subtitle">Operating decisions for ${esc(op.name)}.</div>`;

  html += `<div class="card">
    <div class="card-title">Sales & Marketing</div>
    <div class="form-row">
      <button class="primary" data-sales="${op.id}">Run Sales Push — $4,000</button>
    </div>
    <div class="dim" style="font-size:11.5px;margin-top:6px">Costs $4,000, with a chance (based on sales headcount) of landing a new wholesale account worth $4k–$16k/month.</div>
  </div>`;

  html += `<div class="card">
    <div class="card-title">Dividends</div>
    <div class="form-row">
      <button data-dividend="${op.id}" data-amount="10000">Pay $10,000 to parent</button>
      <button data-dividend="${op.id}" data-amount="25000">Pay $25,000</button>
      <button data-dividend="${op.id}" data-amount="50000">Pay $50,000</button>
    </div>
    <div class="dim" style="font-size:11.5px;margin-top:6px">Transfers cash from OpCo to HoldCo. Recorded as a dividend, reducing retained earnings.</div>
  </div>`;

  html += `<div class="card">
    <div class="card-title">Quick Stats</div>
    <div class="kv-grid">
      <div class="kv"><span class="lbl">Cash</span><span class="val">${fm(entityCash(op))}</span></div>
      <div class="kv"><span class="lbl">Active Customers</span><span class="val">${op.customers.filter(c=>c.status==='active').length}</span></div>
      <div class="kv"><span class="lbl">Employees</span><span class="val">${op.employees.length}</span></div>
      <div class="kv"><span class="lbl">Open AR</span><span class="val">${fm(op.ar.filter(x=>x.status==='open').reduce((s,x)=>s+x.amount,0))}</span></div>
    </div>
  </div>`;

  return html;
}

// ═══════════════════════════════════════════════════════════════
//  EVENT BINDING
// ═══════════════════════════════════════════════════════════════
function bindEvents(){
  // Entity click
  document.querySelectorAll('[data-entity]').forEach(el => {
    el.addEventListener('click', () => {
      S.selectedEntity = el.dataset.entity;
      S.screen = 'finance';
      S.finTab = 'pl';
      render();
    });
  });

  // Screen nav
  document.querySelectorAll('.nav-btn').forEach(b => {
    b.addEventListener('click', () => {
      S.screen = b.dataset.screen;
      document.querySelectorAll('.nav-btn').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      render();
    });
  });

  // Finance entity selector
  const finSel = document.getElementById('finEntity');
  if(finSel) finSel.addEventListener('change', () => {
    S.selectedEntity = finSel.value;
    render();
  });

  // Finance tabs
  document.querySelectorAll('[data-fintab]').forEach(t => {
    t.addEventListener('click', () => {
      S.finTab = t.dataset.fintab;
      render();
    });
  });

  // People entity selector
  const pSel = document.getElementById('peopleEntity');
  if(pSel) pSel.addEventListener('change', () => {
    S.peopleEntity = pSel.value;
    render();
  });

  // Hire
  const hireBtn = document.querySelector('[data-hire]');
  if(hireBtn){
    hireBtn.addEventListener('click', () => {
      const role = document.getElementById('hireRole').value;
      hireEmployee(hireBtn.dataset.hire, role);
    });
  }

  // Fire
  document.querySelectorAll('[data-fire]').forEach(b => {
    b.addEventListener('click', () => {
      if(confirm('Terminate this employee? Severance: one month salary.')){
        fireEmployee(b.dataset.entity, b.dataset.fire);
      }
    });
  });

  // Doc actions
  document.querySelectorAll('[data-doc-action]').forEach(b => {
    b.addEventListener('click', () => {
      const action = b.dataset.docAction;
      const docId = b.dataset.docId;
      const doc = S.docs.find(d => d.id === docId);
      if(!doc) return;
      if(action === 'dismiss-doc'){
        doc.resolved = true;
        doc.unread = false;
      } else if(action === 'rescue-payroll'){
        const ent = getEntity(b.dataset.entity);
        const hc = holding();
        const amt = parseInt(b.dataset.amount);
        if(entityCash(hc) >= amt){
          post(hc, 'Intercompany transfer — payroll rescue', [
            {account:'1400', debit:amt},
            {account:'1000', credit:amt},
          ]);
          post(ent, 'Capital injection from parent', [
            {account:'1000', debit:amt},
            {account:'3000', credit:amt},
          ]);
          addFeed('Payroll rescued via HoldCo transfer', 'good');
        } else {
          addFeed('HoldCo also has insufficient cash', 'warn');
        }
        doc.resolved = true;
      } else if(action === 'defer-payroll'){
        doc.resolved = true;
        addFeed('Payroll deferred — employee relations will suffer', 'warn');
      }
      render();
    });
  });

  // Acquire
  document.querySelectorAll('[data-acquire]').forEach(b => {
    b.addEventListener('click', () => {
      acquireCompany(parseInt(b.dataset.acquire));
    });
  });

  // Found
  document.querySelectorAll('[data-found]').forEach(b => {
    b.addEventListener('click', () => {
      foundCompany(b.dataset.found);
    });
  });

  // Loan
  document.querySelectorAll('[data-loan]').forEach(b => {
    b.addEventListener('click', () => {
      takeLoan(b.dataset.loan, parseInt(b.dataset.amount));
    });
  });

  // Sales push
  document.querySelectorAll('[data-sales]').forEach(b => {
    b.addEventListener('click', () => {
      runSalesPush(b.dataset.sales);
    });
  });

  // Dividend
  document.querySelectorAll('[data-dividend]').forEach(b => {
    b.addEventListener('click', () => {
      payDividend(b.dataset.dividend, parseInt(b.dataset.amount));
    });
  });
}

// ═══════════════════════════════════════════════════════════════
//  TOP BAR CONTROLS
// ═══════════════════════════════════════════════════════════════
document.getElementById('bDay').addEventListener('click', () => {
  if(S.gameOver) return;
  tickDay();
});
document.getElementById('bWeek').addEventListener('click', () => {
  if(S.gameOver) return;
  for(let i=0; i<5; i++) tickDay();
});
document.getElementById('bMonth').addEventListener('click', () => {
  if(S.gameOver) return;
  for(let i=0; i<21; i++){
    if(S.gameOver) break;
    tickDay();
  }
});
document.getElementById('bAuto').addEventListener('click', () => {
  if(S.gameOver) return;
  if(S.autoTimer){
    clearInterval(S.autoTimer);
    S.autoTimer = null;
    document.getElementById('bAuto').textContent = '▶ Auto';
    document.getElementById('bAuto').classList.add('primary');
  } else {
    document.getElementById('bAuto').textContent = '⏸ Pause';
    document.getElementById('bAuto').classList.remove('primary');
    S.autoTimer = setInterval(() => {
      if(S.gameOver){ clearInterval(S.autoTimer); return; }
      tickDay();
    }, 220);
  }
});

// ═══════════════════════════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════════════════════════
setupCompany();
render();

})();
</script>
</body>
</html>
